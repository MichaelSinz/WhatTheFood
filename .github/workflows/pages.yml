# Daily weekday build of the GitHub Pages site
# Starts early in the day Pacific Time
name: Publish GitHub Pages

on:
  schedule:
    - cron: '17 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install current stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable

      - name: Test, build, and fetch fresh menus
        run: make quick-web

      - name: Generate publication badge
        run: |
          python3 - <<'PY'
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          published = (datetime.now(timezone.utc) + timedelta(minutes=1)).replace(
              second=0, microsecond=0
          ).astimezone(ZoneInfo("America/Los_Angeles"))
          timestamp = published.strftime("%Y-%m-%d %H:%M %Z")
          label = f"Last published: {timestamp}"
          Path("web/last-published.svg").write_text(f"""\
          <svg xmlns="http://www.w3.org/2000/svg" width="272" height="20" role="img" aria-label="{label}">
            <title>{label}</title>
            <rect width="272" height="20" rx="3" fill="#555"/>
            <path d="M104 0h165a3 3 0 0 1 3 3v14a3 3 0 0 1-3 3H104z" fill="#4c1"/>
            <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
              <text x="52" y="14">Last published</text>
              <text x="188" y="14">{timestamp}</text>
            </g>
          </svg>
          """, encoding="utf-8")
          PY

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
